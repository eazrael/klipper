# printer-snapmaker-j1-macros.cfg — consolidated user macros (symlinked as macros.cfg)
# Sections: 1 logging/util  2 IDEX engine  3 T1 XY offset  4 filament load/unload  5 lifecycle
# Related config: hardware.cfg (devices + [filament_j1_motion]); mainsail.cfg ([respond]/[pause_resume]);
# printer.cfg ([gcode_arcs] [exclude_object] [firmware_retraction] [save_variables] [stepper_z] seed, _J1_CONFIG).


# ═══ 1. LOGGING / UTILITY ═══
# INFO/WARN/ERROR_LOG → KlipperScreen popups (blue/yellow/red) + Mainsail console.

[gcode_macro INFO_LOG]
gcode:
    RESPOND TYPE=echo MSG="{params.MSG}"

[gcode_macro WARN_LOG]
gcode:
    RESPOND TYPE=command MSG="// warning: {params.MSG}"

[gcode_macro ERROR_LOG]
gcode:
    RESPOND TYPE=error MSG="{params.MSG}"

[gcode_macro DBG_LOG]
description: Verbose debug log — only emits when _J1_CONFIG.debug is True
gcode:
    {% if 'gcode_macro _J1_CONFIG' in printer and printer["gcode_macro _J1_CONFIG"].debug %}
        RESPOND PREFIX="-- " MSG="{params.MSG}"
    {% endif %}

# _HOMED.ready: set to 1 by START_PRINT after setup, reset by RESET_RUNTIME_STATE. Lets
# _SWITCH_TO_EXTRUDER ignore redundant slicer T0/T1 mid-print.
[gcode_macro _HOMED]
variable_ready: 0
gcode:
    # no-op — state storage only

# G1 override: block Z moves until Z is homed (catches stray pre-home slicer Z moves).
[gcode_macro G1]
rename_existing: G1.1
gcode:
    {% if params.Z is defined and "z" not in printer.toolhead.homed_axes %}
        DBG_LOG MSG="G1 Z blocked — Z not homed"
    {% else %}
        G1.1 {rawparams}
    {% endif %}

# _WIPE_NOZZLE: 3 wipes on the parking-pad sponge. T=0|1 (default active). Caller manages Z.
[gcode_macro _WIPE_NOZZLE]
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t == -1 %}
        {% set t = 0 if printer.toolhead.extruder == 'extruder' else 1 %}
    {% endif %}
    {% set x_off = printer.gcode_move.homing_origin.x %}
    {% if t == 0 %}
        {% set pad_x  = printer.configfile.settings.stepper_x.position_min|float %}
        {% set wipe_x = pad_x + 10 %}
    {% else %}
        {% set pad_x  = printer.configfile.settings.dual_carriage.position_max|float - x_off %}
        {% set wipe_x = pad_x - 10 %}
    {% endif %}
    DBG_LOG MSG="Wipe T{t} — pad_x={pad_x} wipe_x={wipe_x}"
    G90
    G1.1 X{wipe_x} Y5 F12000
    {% for i in range(3) %}
        G1.1 X{pad_x}  F3000
        G1.1 X{wipe_x} F3000
    {% endfor %}

[gcode_macro G12]
description: Clean the active nozzle (wipe on the parking-pad sponge)
gcode:
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=g12
        _WIPE_NOZZLE
        RESTORE_GCODE_STATE NAME=g12 MOVE=1 MOVE_SPEED=150
    {% else %}
        ERROR_LOG MSG="G12: home X and Y first"
    {% endif %}

[gcode_macro M600]
gcode:
    PAUSE

# Z offset persistence is native: babystep then Z_OFFSET_APPLY_ENDSTOP (or KlipperScreen
# Z-Calibrate) → writes [stepper_z] position_endstop + SAVE_CONFIG.

[gcode_macro DEBUG_EXTRUDER]
gcode:
    {action_respond_info("gcode_position.e: %.2f" % printer.gcode_move.gcode_position.e)}


# ═══ 2. IDEX ENGINE — toolchange, COPY/MIRROR/PRIMARY, T0/T1, G28, M104/106/109/107 ═══
# Z is handled by [stepper_z] position_endstop; the engine never sets a calibration Z
# offset, so a live babystep survives toolchanges.

# Per-head target temps + fan speeds, so a toolchange can restore them.
[gcode_macro _J1_RUNTIME_STATE]
variable_left_part_fan: 0
variable_right_part_fan: 0
variable_left_temp: -1
variable_right_temp: -1
gcode:
    # no-op — state storage only

[gcode_macro RESET_RUNTIME_STATE]
description: Reset runtime state (fans, stored temps) and the homed-ready flag
gcode:
    SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_part_fan  VALUE=0
    SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_part_fan VALUE=0
    SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_temp      VALUE=-1
    SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_temp     VALUE=-1
    SET_GCODE_VARIABLE MACRO=_HOMED VARIABLE=ready VALUE=0

[gcode_macro _IDEX_DECOUPLE]
description: Decouple both carriages to independent PRIMARY mode
gcode:
    DBG_LOG MSG="IDEX decoupling"
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder  MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    {% if printer.toolhead.extruder == 'extruder' %}
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    {% else %}
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    {% endif %}

[gcode_macro _SWITCH_TO_EXTRUDER]
description: Internal extruder switch used by T0/T1
gcode:
    {% set name     = params.NAME %}
    {% set is_t0    = (name == 'extruder') %}
    {% set autopark = params.AUTOPARK|default(1)|int %}
    {% set current  = printer.toolhead.extruder %}

    # Skip if target already active, or COPY/MIRROR active mid-print (ignore slicer T0/T1).
    {% set dc = printer.dual_carriage %}
    {% set is_coupled = (dc is defined and dc.carriage_1|default('PRIMARY') in ['COPY', 'MIRROR']) %}
    {% if (current == name or is_coupled) and printer["gcode_macro _HOMED"].ready == 1 %}
        DBG_LOG MSG="Switch ignored — target={name} active={current} coupled={is_coupled}"
        G92 E0
    {% else %}

        # Park the source carriage before decoupling (raw G28.0 avoids the G28 re-sync).
        {% if autopark == 1 and 'z' in printer.toolhead.homed_axes %}
            {% if 'x' not in printer.toolhead.homed_axes %}
                G28.0 X
            {% endif %}
            G90
            {% if current == 'extruder' %}
                G1.1 X{printer.configfile.settings.stepper_x.position_min} F18000
                DBG_LOG MSG="Park source T0 -> X{printer.configfile.settings.stepper_x.position_min}"
            {% else %}
                {% set t1_x_off = printer["gcode_macro _J1_CONFIG"].right_nozzle_adjust_x|default(0)|float|abs %}
                {% set park_t1  = printer.configfile.settings.dual_carriage.position_max - t1_x_off - 1 %}
                G1.1 X{park_t1} F18000
                DBG_LOG MSG="Park source T1 -> X{park_t1}"
            {% endif %}
        {% elif autopark == 1 %}
            WARN_LOG MSG="Park skipped — Z not homed"
        {% endif %}

        {% set source_fan = "left_part_fan" if current == "extruder" else "right_part_fan" %}
        SET_FAN_SPEED FAN={source_fan} SPEED=0
        _IDEX_DECOUPLE

        # Target XY offset only (Z stays in position_endstop; babystep survives toolchanges).
        {% if is_t0 or printer.dual_carriage.carriage_1|default('PRIMARY') in ['COPY', 'MIRROR'] %}
            SET_GCODE_OFFSET X=0 Y=0
        {% else %}
            SET_GCODE_OFFSET X={printer["gcode_macro _J1_CONFIG"].right_nozzle_adjust_x} Y={printer["gcode_macro _J1_CONFIG"].right_nozzle_adjust_y}
        {% endif %}

        ACTIVATE_EXTRUDER EXTRUDER={name}
        SET_DUAL_CARRIAGE CARRIAGE={0 if is_t0 else 1} MODE=PRIMARY

        {% set target_fan       = "left_part_fan" if is_t0 else "right_part_fan" %}
        {% set target_fan_speed = printer["gcode_macro _J1_RUNTIME_STATE"].left_part_fan if is_t0 else printer["gcode_macro _J1_RUNTIME_STATE"].right_part_fan %}
        SET_FAN_SPEED FAN={target_fan} SPEED={target_fan_speed}
        G92 E0

        {% set target_temp = printer["gcode_macro _J1_RUNTIME_STATE"].left_temp if is_t0 else printer["gcode_macro _J1_RUNTIME_STATE"].right_temp %}
        # Uncomment to wait for the target head's temp on every toolchange:
        # {% if target_temp > 0 %}
        #     M109.1 S{target_temp}
        # {% endif %}

        # Safe feedrate before handing back to slicer gcode.
        G1.1 F3000
        DBG_LOG MSG="Switch OK — active={name}"
    {% endif %}

[gcode_macro T0]
description: Activate the left extruder (T0)
gcode:
    _SWITCH_TO_EXTRUDER NAME=extruder AUTOPARK={params.AUTOPARK|default(1)|int}

[gcode_macro T1]
description: Activate the right extruder (T1)
gcode:
    _SWITCH_TO_EXTRUDER NAME=extruder1 AUTOPARK={params.AUTOPARK|default(1)|int}

# G28 override: re-sync carriage<->extruder after homing so IDEX state stays consistent.
# Bare G28 homes Z first to drop the bed clear (Klipper's native axis order is X,Y,Z).
[gcode_macro G28]
rename_existing: G28.0
gcode:
    {% set active = printer.toolhead.extruder %}
    {% if rawparams|trim %}
        G28.0 {rawparams}        # explicit axis request — honor as typed
    {% else %}
        G28.0 Z                  # bed drops first → clearance for the nozzles
        G28.0 X
        G28.0 Y
    {% endif %}
    {% if 'x' in printer.toolhead.homed_axes %}
        SET_DUAL_CARRIAGE CARRIAGE={0 if active == 'extruder' else 1} MODE=PRIMARY
        ACTIVATE_EXTRUDER EXTRUDER={active}
    {% endif %}

# M104/M109/M106/M107: track per-head temps/fans in _J1_RUNTIME_STATE, IDEX-aware.
# Internal code uses the renamed originals M104.1 / M109.1.
[gcode_macro M104]
rename_existing: M104.1
description: Set hotend temp; store target in _J1_RUNTIME_STATE (IDEX-aware)
gcode:
    {% set s = params.S|default(0)|float %}
    {% set t = params.T|int if params.T is defined else (1 if printer.toolhead.extruder == 'extruder1' else 0) %}
    {% if printer.dual_carriage is defined and printer.dual_carriage.carriage_1|default('PRIMARY') in ['COPY', 'MIRROR'] %}
        SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_temp  VALUE={s}
        SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_temp VALUE={s}
        M104.1 S{s} T0
        M104.1 S{s} T1
    {% else %}
        {% if t == 0 %}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_temp VALUE={s}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_temp VALUE={s}
        {% endif %}
        M104.1 S{s} T{t}
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
description: Set hotend temp and wait; store target in _J1_RUNTIME_STATE (IDEX-aware)
gcode:
    {% set s = params.S|default(0)|float %}
    {% set t = params.T|int if params.T is defined else (1 if printer.toolhead.extruder == 'extruder1' else 0) %}
    {% if printer.dual_carriage is defined and printer.dual_carriage.carriage_1|default('PRIMARY') in ['COPY', 'MIRROR'] %}
        SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_temp  VALUE={s}
        SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_temp VALUE={s}
        M109.1 S{s} T0
        M109.1 S{s} T1
    {% else %}
        {% if t == 0 %}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_temp VALUE={s}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_temp VALUE={s}
        {% endif %}
        M109.1 S{s} T{t}
    {% endif %}

[gcode_macro M106]
description: Set part-fan speed. Explicit P (P0=left, P1=right) targets one fan;
            without P, IDEX-aware auto-logic (COPY/MIRROR or dual-tool → both).
gcode:
    {% set speed = params.S|default(255)|float / 255.0 %}
    {% if params.P is defined %}
        {% set p = params.P|int %}
        {% if p == 0 %}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_part_fan VALUE={speed}
            SET_FAN_SPEED FAN=left_part_fan SPEED={speed}
        {% elif p == 1 %}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_part_fan VALUE={speed}
            SET_FAN_SPEED FAN=right_part_fan SPEED={speed}
        {% endif %}
    {% elif printer.dual_carriage is defined and printer.dual_carriage.carriage_1|default('PRIMARY') in ['COPY', 'MIRROR'] %}
        SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_part_fan  VALUE={speed}
        SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_part_fan VALUE={speed}
        SET_FAN_SPEED FAN=left_part_fan  SPEED={speed}
        SET_FAN_SPEED FAN=right_part_fan SPEED={speed}
    {% else %}
        {% set l_temp = printer["gcode_macro _J1_RUNTIME_STATE"].left_temp %}
        {% set r_temp = printer["gcode_macro _J1_RUNTIME_STATE"].right_temp %}
        {% if l_temp > 0 and r_temp > 0 %}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=left_part_fan  VALUE={speed}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE=right_part_fan VALUE={speed}
            SET_FAN_SPEED FAN=left_part_fan  SPEED={speed}
            SET_FAN_SPEED FAN=right_part_fan SPEED={speed}
        {% else %}
            {% set fan = "left_part_fan" if printer.toolhead.extruder == "extruder" else "right_part_fan" %}
            SET_GCODE_VARIABLE MACRO=_J1_RUNTIME_STATE VARIABLE={fan} VALUE={speed}
            SET_FAN_SPEED FAN={fan} SPEED={speed}
        {% endif %}
    {% endif %}

[gcode_macro M107]
description: Turn off the part fan(s). Honors an explicit P like M106.
gcode:
    {% if params.P is defined %}
        M106 P{params.P} S0
    {% else %}
        M106 S0
    {% endif %}

[gcode_macro IDEX_COPY]
description: COPY mode — both heads print the same part side by side
gcode:
    {% set spacing = params.SPACING|default(165)|float %}
    {% set x_min   = printer.configfile.settings.stepper_x.position_min %}
    # Do not use ACTIVATE_EXTRUDER during positioning / after COPY — it breaks carriage sync.
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder  MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G92 E0
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G90
    G1.1 X{x_min} F6000
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1.1 X{x_min + spacing} F6000
    # Re-assert C0 PRIMARY before switching C1 to COPY (Klipper needs another carriage active first).
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    G92 E0
    INFO_LOG MSG="COPY mode active — spacing={spacing}mm"

[gcode_macro IDEX_MIRROR]
description: MIRROR mode — both heads print symmetrically about the bed centre
gcode:
    {% set x_min = printer.configfile.settings.stepper_x.position_min %}
    {% set x_max = printer.configfile.settings.dual_carriage.position_max %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder  MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G92 E0
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G90
    G1.1 X{x_min} F6000
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1.1 X{x_max} F6000
    # Re-assert C0 PRIMARY before switching C1 to MIRROR (Klipper needs another carriage active first).
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    G92 E0
    INFO_LOG MSG="MIRROR mode active — T0=X{x_min} T1=X{x_max}"

[gcode_macro IDEX_PRIMARY]
description: Return to PRIMARY mode — normal printing with T0
gcode:
    _IDEX_DECOUPLE
    SET_GCODE_OFFSET X=0 Y=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G92 E0
    INFO_LOG MSG="PRIMARY mode active"

[gcode_macro SELECT_T0]
description: Switch to T0 for manual jogging (no auto-park)
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_RIGHT_ADJUSTMENTS OP=reset
    M117 T0 manual jogging active

[gcode_macro SELECT_T1]
description: Switch to T1 for manual jogging (no auto-park)
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_DUAL_CARRIAGE CARRIAGE=1
    SET_RIGHT_ADJUSTMENTS OP=apply
    M117 T1 manual jogging active

[gcode_macro PARK_LEFT_EXTRUDER]
description: Park T0 on the left
gcode:
    {% set x_min = printer.configfile.settings.stepper_x.position_min %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G92 E0
    _IDEX_DECOUPLE
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_OFFSET X=0 Y=0
    G92 E0
    G90
    G1.1 X{x_min} F18000
    INFO_LOG MSG="T0 parked"

[gcode_macro PARK_RIGHT_EXTRUDER]
description: Park T1 on the right
gcode:
    {% set x_max    = printer.configfile.settings.dual_carriage.position_max %}
    {% set t1_x_off = printer["gcode_macro _J1_CONFIG"].right_nozzle_adjust_x|abs %}
    {% set park_x   = x_max - t1_x_off - 1 %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G92 E0
    _IDEX_DECOUPLE
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G92 E0
    G90
    G1.1 X{park_x} F18000
    INFO_LOG MSG="T1 parked"

# Guided Z calibration (Z_MAX-endstop safe): positions T0 over bed centre and lowers to a
# 5 mm gap, then starts the native manual probe (no lift, unlike KlipperScreen's panel).
[gcode_macro Z_CALIBRATE]
description: Guided manual Z calibration over the bed centre (TESTZ -> ACCEPT -> SAVE_CONFIG)
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% set x_center = (printer.configfile.settings.dual_carriage.position_max + printer.configfile.settings.stepper_x.position_min) / 2 %}
    {% set y_center = printer.configfile.settings.stepper_y.position_max / 2 %}
    _IDEX_DECOUPLE
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_OFFSET X=0 Y=0
    G90
    G1.1 X{x_center} Y{y_center} F9000
    G1.1 Z5 F600
    INFO_LOG MSG="Z calibrate: TESTZ Z=-1 (etc.) down to the paper, then ACCEPT, then SAVE_CONFIG"
    Z_ENDSTOP_CALIBRATE


# ═══ 3. T1 XY OFFSET ═══
# SET_RIGHT_ADJUSTMENTS applies/resets the T1 nozzle XY gcode offset (used by SELECT_T0/T1).
# Leaves Z untouched (no software Z offset; both heads share [stepper_z] position_endstop).

[gcode_macro SET_RIGHT_ADJUSTMENTS]
gcode:
    {% if params.OP|lower == 'reset' %}
        INFO_LOG MSG="Resetting T1 offsets"
        SET_GCODE_OFFSET X=0
        SET_GCODE_OFFSET Y=0
    {% elif params.OP|lower == 'apply' %}
        INFO_LOG MSG="Applying T1 offsets"
        SET_GCODE_OFFSET X={printer["gcode_macro _J1_CONFIG"].right_nozzle_adjust_x|float}
        SET_GCODE_OFFSET Y={printer["gcode_macro _J1_CONFIG"].right_nozzle_adjust_y|float}
    {% else %}
        WARN_LOG MSG="SET_RIGHT_ADJUSTMENTS: unknown OP '{params.OP}'"
    {% endif %}


# ═══ 4. FILAMENT LOAD / UNLOAD ═══
# LOAD_FILAMENT / UNLOAD_FILAMENT act on the ACTIVE extruder only (switch heads first for
# the other). Temperature is never guessed: TEMP= wins, else MATERIAL= from the table below,
# else the current hotend target if hot, else it refuses. KlipperScreen's Load/Unload buttons
# call these (passing SPEED) — preheat first, or call e.g. LOAD_FILAMENT MATERIAL=PLA.

[gcode_macro _FILAMENT]
description: Internal load/unload engine (MODE=load|unload)
gcode:
    {% set mode     = params.MODE %}
    {% set t        = 0 if printer.toolhead.extruder == 'extruder' else 1 %}
    {% set heater   = printer.toolhead.extruder %}
    {% set mat      = params.MATERIAL|default('')|upper %}
    # Material → nozzle temp — adjust to your filaments:
    {% set temps    = {'PLA': 210, 'PETG': 240, 'ABS': 250, 'TPU': 230} %}
    {% set speed    = params.SPEED|default(300)|float %}
    {% set fast     = printer.configfile.settings[heater].max_extrude_only_velocity * 60 %}

    {% if params.TEMP is defined %}
        {% set temp = params.TEMP|float %}
    {% elif mat in temps %}
        {% set temp = temps[mat] %}
    {% elif printer[heater].target > 0 %}
        {% set temp = printer[heater].target %}
    {% else %}
        {% set temp = 0 %}
    {% endif %}

    {% if temp <= 0 %}
        ERROR_LOG MSG="{mode|upper}_FILAMENT: preheat first, or pass MATERIAL=PLA/PETG/ABS/TPU or TEMP="
    {% else %}
        {% set x_center = (printer.configfile.settings.dual_carriage.position_max + printer.configfile.settings.stepper_x.position_min) / 2 %}
        {% set y_center = printer.configfile.settings.stepper_y.position_max / 2 %}
        {% set z_max    = printer.configfile.settings.stepper_z.position_endstop %}

        # Home if needed, drop the bed for clearance, centre the active head.
        {% if 'xyz' not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        G90
        SET_DUAL_CARRIAGE CARRIAGE={t} MODE=PRIMARY
        G1.1 Z{z_max} F600
        G1.1 X{x_center} Y{y_center} F9000

        M109.1 S{temp} T{t}

        M83
        G92 E0
        {% if mode == 'load' %}
            {% set length = params.LENGTH|default(60)|float %}
            {% set purge  = params.PURGE|default(25)|float %}
            G1.1 E{length} F{fast}     # fast load to the nozzle
            G1.1 E{purge} F{speed}     # purge fresh filament
            G1.1 E-2 F{speed}          # small retract to stop ooze
            G92 E0
            INFO_LOG MSG="Filament loaded on {heater}"
        {% else %}
            {% set length = params.LENGTH|default(80)|float %}
            {% set purge  = params.PURGE|default(10)|float %}
            G1.1 E{purge} F{speed}     # short purge to soften/clear the tip
            G1.1 E-{length} F{fast}    # fast retract out of the hotend
            G92 E0
            M104.1 S0 T{t}             # heater off after unload
            INFO_LOG MSG="Filament unloaded on {heater} — remove it"
        {% endif %}
    {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Load filament into the active hotend. [MATERIAL=|TEMP=] [SPEED=] [LENGTH=] [PURGE=]
gcode:
    _FILAMENT MODE=load {rawparams}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the active hotend. [MATERIAL=|TEMP=] [SPEED=] [LENGTH=] [PURGE=]
gcode:
    _FILAMENT MODE=unload {rawparams}


# ═══ 5. PRINT LIFECYCLE — START/END/CANCEL/PAUSE/RESUME ═══
# [pause_resume] is provided by mainsail.cfg; our PAUSE/RESUME/CANCEL_PRINT own those commands
# (Mainsail's removed in the trimmed mainsail.cfg to avoid a double rename_existing at startup).
# Retract is kept small (direct-drive hotend clogs if molten filament is pulled above the heat break).

[gcode_macro _PAUSE_STATE]
# Machine state captured at PAUSE for RESUME
variable_x:          0.0
variable_y:          0.0
variable_z:          0.0
variable_e:          0.0
variable_extruder:  'extruder'
variable_idex_mode: 'PRIMARY'
variable_fan_left:   0.0
variable_fan_right:  0.0
gcode:
    # no-op — state storage only

# START_PRINT contract (finalise with the Orca start g-code):
#   START_PRINT BED_TEMP=.. T0_TEMP=.. T1_TEMP=.. [T0_USED=0|1] [T1_USED=0|1]
#               [IDEX_MODE=IDEX|COPY|MIRROR] [SPACING=165] [START_EXTRUDER=0|1]
# T0_USED/T1_USED come from Orca is_extruder_used[]; else inferred from temp>0. Every used head
# MUST have temp>0 or START_PRINT aborts (no silent defaults). COPY/MIRROR always use both heads.
[gcode_macro START_PRINT]
description: Print start — home, heat bed + used extruders together, set IDEX mode / start tool
gcode:
    {% set BED_TEMP  = params.BED_TEMP|default(0)|float %}
    {% set T0_TEMP   = params.T0_TEMP|default(0)|float %}
    {% set T1_TEMP   = params.T1_TEMP|default(0)|float %}
    {% set IDEX_MODE = params.IDEX_MODE|default('IDEX')|upper %}
    {% set SPACING   = params.SPACING|default(165)|float %}
    {% set start_t   = params.START_EXTRUDER|default(0)|int %}
    {% set is_dup    = IDEX_MODE in ['COPY', 'MIRROR'] %}

    {% set t0_used = (params.T0_USED|default(1 if T0_TEMP > 0 else 0)|int == 1) or is_dup %}
    {% set t1_used = (params.T1_USED|default(1 if T1_TEMP > 0 else 0)|int == 1) or is_dup %}

    {% if not (t0_used or t1_used) %}
        { action_raise_error("START_PRINT: no extruder in use (T0_TEMP and T1_TEMP both 0)") }
    {% endif %}
    {% if t0_used and T0_TEMP <= 0 %}
        { action_raise_error("START_PRINT: T0 is used but T0_TEMP is 0") }
    {% endif %}
    {% if t1_used and T1_TEMP <= 0 %}
        { action_raise_error("START_PRINT: T1 is used but T1_TEMP is 0") }
    {% endif %}

    # PRIMARY single-tool: start on whichever head is used.
    {% if not is_dup %}
        {% if t0_used and not t1_used %}{% set start_t = 0 %}{% endif %}
        {% if t1_used and not t0_used %}{% set start_t = 1 %}{% endif %}
    {% endif %}

    RESET_RUNTIME_STATE
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G92 E0
    M83

    G28

    # Heat bed + every used extruder, then wait (heads ooze onto their sponges meanwhile).
    {% if BED_TEMP > 0 %} M140 S{BED_TEMP} {% endif %}
    {% if t0_used %} M104 S{T0_TEMP} T0 {% endif %}
    {% if t1_used %} M104 S{T1_TEMP} T1 {% endif %}
    {% if BED_TEMP > 0 %} M190 S{BED_TEMP} {% endif %}
    {% if t0_used %} M109 S{T0_TEMP} T0 {% endif %}
    {% if t1_used %} M109 S{T1_TEMP} T1 {% endif %}

    # Select print mode (offsets applied), ready for the slicer prime line.
    {% if IDEX_MODE == 'COPY' %}
        IDEX_COPY SPACING={SPACING}
    {% elif IDEX_MODE == 'MIRROR' %}
        IDEX_MIRROR
    {% else %}
        {% if start_t == 1 %}
            T1 AUTOPARK=0
        {% else %}
            T0 AUTOPARK=0
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_HOMED VARIABLE=ready VALUE=1
    INFO_LOG MSG="Print started — mode={IDEX_MODE} T0={T0_TEMP} T1={T1_TEMP} Bed={BED_TEMP}"

[gcode_macro PAUSE]
description: Pause — save state, retract, Z-hop, park the active head
rename_existing: PAUSE_BASE
gcode:
    {% set park_offset = 10 %}
    {% set retract     = 2.0 %}
    {% set z_hop       = 10 %}
    {% set z_max       = printer.configfile.settings.stepper_z.position_endstop|float %}
    {% set x_min       = printer.configfile.settings.stepper_x.position_min %}
    {% set x_max       = printer.configfile.settings.dual_carriage.position_max %}
    {% set t1_x_off    = printer["gcode_macro _J1_CONFIG"].right_nozzle_adjust_x|default(0)|float|abs %}
    {% set cur         = printer.toolhead.extruder %}
    {% set is_t0       = (cur == 'extruder') %}
    {% set idex_mode   = printer.dual_carriage.carriage_1 %}

    # Save state BEFORE any move (gcode_position = offset-aware coords).
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=x         VALUE={printer.gcode_move.gcode_position.x}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=y         VALUE={printer.gcode_move.gcode_position.y}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=z         VALUE={printer.gcode_move.gcode_position.z}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=e         VALUE={printer.gcode_move.gcode_position.e}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=extruder  VALUE='"{cur}"'
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=idex_mode VALUE='"{idex_mode}"'
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=fan_left  VALUE={printer["fan_generic left_part_fan"].speed}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=fan_right VALUE={printer["fan_generic right_part_fan"].speed}

    INFO_LOG MSG="PAUSE — mode={idex_mode} extruder={cur}"

    {% if idex_mode in ['COPY', 'MIRROR'] %}
        _IDEX_DECOUPLE
    {% endif %}

    SET_FAN_SPEED FAN=left_part_fan  SPEED=0
    SET_FAN_SPEED FAN=right_part_fan SPEED=0

    # Clog-safe retract (relative; restore E coords after).
    SAVE_GCODE_STATE NAME=_pause_retract
    G91
    G1.1 E-{retract} F300
    RESTORE_GCODE_STATE NAME=_pause_retract

    {% set z_safe = [printer.gcode_move.gcode_position.z + z_hop, z_max - 5] | min %}
    G90
    G1.1 Z{z_safe} F600

    # In COPY/MIRROR, T1 was following — park it right explicitly first.
    {% if idex_mode in ['COPY', 'MIRROR'] %}
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
        G1.1 X{x_max - t1_x_off - park_offset} F12000
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    {% endif %}

    {% if is_t0 %}
        G1.1 X{x_min + park_offset} Y5 F12000
    {% else %}
        G1.1 X{x_max - t1_x_off - park_offset} Y5 F12000
    {% endif %}

    PAUSE_BASE
    INFO_LOG MSG="Paused — RESUME to continue"

[gcode_macro RESUME]
description: Resume after a pause — restore mode, fans, re-prime, return
rename_existing: RESUME_BASE
gcode:
    {% set state   = printer["gcode_macro _PAUSE_STATE"] %}
    {% set retract = 2.0 %}

    INFO_LOG MSG="RESUME — returning to ({state.x},{state.y},{state.z}) mode={state.idex_mode}"

    RESUME_BASE

    # Restore IDEX mode FIRST so the re-prime is synced in COPY/MIRROR.
    {% if state.idex_mode == 'COPY' %}
        IDEX_COPY
    {% elif state.idex_mode == 'MIRROR' %}
        IDEX_MIRROR
    {% endif %}

    G91
    G1.1 E{retract} F300
    G90
    G92 E{state.e}

    SET_FAN_SPEED FAN=left_part_fan  SPEED={state.fan_left}
    SET_FAN_SPEED FAN=right_part_fan SPEED={state.fan_right}

    # Return to saved XY, then drop Z; the slicer's next move sets the feedrate.
    G1.1 X{state.x} Y{state.y} F12000
    G1.1 Z{state.z} F600
    INFO_LOG MSG="Print resumed"

[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set z_max = printer.configfile.settings.stepper_z.position_endstop|float %}
    CLEAR_PAUSE

    {% if printer[printer.toolhead.extruder].can_extrude %}
        G91
        G1.1 E-0.5 F300
        G90
    {% endif %}

    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=left_part_fan  SPEED=0
    SET_FAN_SPEED FAN=right_part_fan SPEED=0
    _IDEX_DECOUPLE
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G92 E0

    # Bed fully down (if homed), then park both heads on their sponges (home X).
    {% if 'z' in printer.toolhead.homed_axes %}
        G1.1 Z{z_max} F600
    {% endif %}
    G28.0 X

    RESET_RUNTIME_STATE
    CANCEL_PRINT_BASE
    INFO_LOG MSG="Print cancelled"

[gcode_macro END_PRINT]
description: End of print — retract, drop the bed, park both heads
gcode:
    {% set z_max = printer.configfile.settings.stepper_z.position_endstop|float %}

    {% if printer[printer.toolhead.extruder].can_extrude %}
        G91
        G1.1 E-1 F300
        G90
    {% endif %}

    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=left_part_fan  SPEED=0
    SET_FAN_SPEED FAN=right_part_fan SPEED=0
    _IDEX_DECOUPLE
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G92 E0

    # Bed fully down (presents the print), then park both heads by homing X.
    G1.1 Z{z_max} F600
    G28.0 X

    RESET_RUNTIME_STATE
    INFO_LOG MSG="Print complete"
