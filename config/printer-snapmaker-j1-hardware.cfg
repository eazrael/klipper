#sensor_pin: PA0



[heater_bed]
heater_pin: PA10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
pullup_resistor: 4700
min_temp: 5
max_temp: 110

# Thermal-runaway protection for the bed
[verify_heater heater_bed]
max_error: 120
check_gain_time: 120
hysteresis: 10
heating_gain: 2

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 3600
