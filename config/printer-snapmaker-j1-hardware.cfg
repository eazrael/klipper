# ── Mainboard / electronics bay (NOT the print chamber) ──
# Snapmaker's source pin names are misleading:
#   CHAMBER_AUTO_FAN_PIN (PC6) = the chamber_fan below — the small fan cooling the
#                                mainboard/PSU compartment (undersized; left on statically)
#   TEMP_CHAMBER_PIN     (PA2) = a thermistor in that compartment (no external connector),
#                                read below as "Mainboard" for clarity
#   HEATER_CHAMBER_PIN   (PD3) = an actual print-chamber heater — not wired/used here
# Always-on alternative (sole active cooling regardless of temperature, incl.
# shutdown/fault). Superseded below by the thermostatic temperature_fan; keep one.
# [output_pin chamber_fan]
# pin: PC6
# value: 1
# shutdown_value: 1

# [temperature_sensor Mainboard]
# sensor_type: EPCOS 100K B57560G104F
# sensor_pin: PA2
# min_temp: 0
# max_temp: 70


[temperature_fan Mainboard]
pin: PC6
# Thermostatic: fan runs only when the mainboard/PSU bay exceeds target_temp,
# off below it (off_below snaps low speeds to 0). NOTE: shutdown_speed 0.0 means
# the fan is OFF on a Klipper shutdown/fault — unlike the always-on output_pin above.
shutdown_speed: 0.0
off_below: 0.25
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
min_temp: 0
max_temp: 70
target_temp: 50
control: watermark

[adc_temperature mcu_internal]
temperature1: 0
voltage1: 2.2992
temperature2: 100
voltage2: 1.6174

[temperature_sensor MCU]
sensor_type: mcu_internal
sensor_pin: ADC_TEMPERATURE
min_temp: 0
max_temp: 100

#If this is set to 0, the display will be powered off..
# [output_pin display_power]
# pin: PD4
#value: 0
#shutdown_value: 0

[led my_led]
white_pin: PB8
cycle_time: 0.001
hardware_pwm: True
initial_WHITE: 1.0

