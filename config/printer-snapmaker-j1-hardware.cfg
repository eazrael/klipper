# ═══════════════════════════════════════════════════════════════════════════
# FILAMENT MOTION SENSORS (analog runout/jam/grind — needs fork firmware)
# ═══════════════════════════════════════════════════════════════════════════

# filament_sensor.cfg — J1 analog filament-motion (runout/jam/grind) detection
#
# The J1's two stock filament sensors are ANALOG motion encoders (not switches):
# the ADC voltage ramps as filament moves and wraps around a "dead zone".
# Detection is meaningful only while extruding — if the commanded filament
# advances but the ADC doesn't change, the filament is stalled (runout, jam,
# tangle, or extruder-gear grinding).
#
# REQUIRES the owner's Klipper fork firmware, which provides:
#   • the [filament_j1_motion] host module (klippy/extras/filament_j1_motion.py)
#   • the GD32 ADC fix (per-channel ownership) — without it, any analog pin can
#     return another channel's value, so filament AND nozzle-temp reads are wrong.
# Stock-hardware sensors, no extra parts needed. See
# docs/filament-motion-sensor-klipper-port.md for the full algorithm/spec.
#
# hw_version selects the sensor thresholds and dead-zone band and MUST match the
# TOOLHEAD/hotend revision (the sensor lives in the toolhead; the firmware reads
# it from HW_VERSION_PIN/PB1). 'auto' is not yet implemented, so set it
# explicitly per machine: v1 or v2. This file ships v1 — verify yours.
#
# PAUSE ONLY DURING A REAL PRINT: do NOT use the built-in pause_on_runout. The
# RunoutHelper fires its pause whenever idle_timeout state is "Printing", which
# is also true during a manual extrude / console jog — so bench-testing the
# sensor would trip PAUSE. Instead pause_on_runout is False and runout_gcode
# gates PAUSE on print_stats.state == "printing" (a file actually printing, not
# paused/idle). Detection still runs when idle — it still logs the stall via
# WARN_LOG (console + KlipperScreen popup) and M117 (display status), handy for
# bench-testing the sensor; it just won't PAUSE unless a print is running.
# Note: M117 only updates the display status line and does NOT echo to the
# console, which is why the WARN_LOG (RESPOND) is what you actually "see" printed.

[filament_j1_motion extruder]
adc_pin: PA4                  # FILAMENT0_ADC_PIN (E0 / left)
extruder: extruder
hw_version: 1                 # ← verify against YOUR toolhead revision (1 or 2)
pause_on_runout: False
runout_gcode:
    WARN_LOG MSG="Filament stall on extruder (T0)"   # console + KlipperScreen popup
    M117 Filament stall on extruder (T0)              # persistent display status line
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}

[filament_j1_motion extruder1]
adc_pin: PA0                  # FILAMENT1_ADC_PIN (E1 / right)
extruder: extruder1
hw_version: 1                 # ← verify against YOUR toolhead revision (1 or 2)
pause_on_runout: False
runout_gcode:
    WARN_LOG MSG="Filament stall on extruder1 (T1)"   # console + KlipperScreen popup
    M117 Filament stall on extruder1 (T1)             # persistent display status line
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}
