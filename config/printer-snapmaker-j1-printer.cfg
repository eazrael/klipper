# printer-snapmaker-j1-printer.cfg — entry point
#
# DEPLOY NOTE: this file is COPIED to ~/printer_data/config/printer.cfg (not
# symlinked) — Klipper must be able to write the auto-generated SAVE_CONFIG block
# at the bottom (PID, etc.). The other .cfg files are symlinked under the names
# the [include] lines expect. So this is the seed/template; the live copy drifts
# as Klipper writes calibration values.
#
# Edit Z calibration (position_endstop) HERE — this is the editable copy.

# ── Includes (deployed/symlink names) — owner's three-file layout ──
[include hardware.cfg]          # ← printer-snapmaker-j1-hardware.cfg : [mcu], [printer], steppers/TMC, extruders, heaters, fans, [filament_j1_motion] sensors
[include mainsail.cfg]          # Mainsail/Moonraker stack: [virtual_sdcard] [pause_resume] [display_status] [respond] + client macros (PAUSE/RESUME/CANCEL_PRINT are ours, in macros.cfg)
# mainsail would override us, but we override mainsail
# ideally the override would go into a mainsail_compat.cfg include and into
# mainsailos 
[include macros.cfg]            # ← printer-snapmaker-j1-macros.cfg   : ALL user macros (logging, IDEX engine, T1 offset, filament load/unload, print lifecycle)

# ── Host / slicer infrastructure ──
# ([respond] and [pause_resume] are provided by mainsail.cfg)
[gcode_arcs]
[exclude_object]

[firmware_retraction]
retract_length: 0.8           # mm
retract_speed: 30             # mm/s
unretract_extra_length: 0     # mm
unretract_speed: 30           # mm/s

# Single persisted-variable store (Z offset etc.) — see offsets.cfg
[save_variables]
filename: ~/printer_data/config/variables.cfg

# ── Z calibration ──
# position_endstop lives HERE (main file) so SAVE_CONFIG can manage it:
# KlipperScreen Z-Calibrate / Z_ENDSTOP_CALIBRATE / Z_OFFSET_APPLY_ENDSTOP write
# the calibrated value into the SAVE_CONFIG block below (which overrides this seed).
# To calibrate by hand, paper-test and edit this value (and clear the autosaved
# one below if present). position_max lives in hardware.cfg.
[stepper_z]
position_endstop: 205


[gcode_macro _J1_CONFIG]
variable_right_nozzle_adjust_x: 0
variable_right_nozzle_adjust_y: 0
variable_debug: False
# Toolchange temp-wait tolerance (used by _WAIT_HOTEND). 1 = Klipper's PID settle delta.
variable_temp_tol_below: 1      # °C — head must reach at least (target - this)
variable_temp_tol_above: 1      # °C — ...and be no hotter than (target + this); raise to skip park-overshoot cooldown
gcode:
    # no-op — config storage only


# Heater control (PID) lives in the auto-generated SAVE_CONFIG block below.
# Retune with: PID_CALIBRATE HEATER=extruder|extruder1|heater_bed TARGET=<temp>
# then SAVE_CONFIG. The values below are seeds — adjust per your machine.

